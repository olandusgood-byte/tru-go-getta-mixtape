name: AB-005 Static Gate

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'docs/AB-005-CONTINUOUS-STAGING.md'
      - '.github/workflows/ab005-static-check.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'docs/AB-005-CONTINUOUS-STAGING.md'
      - '.github/workflows/ab005-static-check.yml'

permissions:
  contents: read

jobs:
  ab005-static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate AB-005 migration contract
        shell: bash
        run: |
          set -euo pipefail
          f="supabase/migrations/20260908_ab005_continuous_staging.sql"
          test -s "$f"
          grep -q "ab005_prepare_staging" "$f"
          grep -q "ab005_record_smoke" "$f"
          grep -q "ab005_rollback_staging" "$f"
          grep -q "ab005_checkpoint" "$f"
          grep -q "ab005_advance_after_clean_pass" "$f"
          grep -q "pass.*fail.*blocked.*manual\|pass.*fail.*blocked.*manual" "$f" || grep -q "IN ('pass','fail','blocked','manual')" "$f"
          grep -q "production_gate_required" "$f"
          grep -q "production_promoted" "$f"
          grep -q "rollback_cutoff" "$f"
          if grep -Eq "create table[^;]*(release_staging_records|release_staging_smoke_results|release_checkpoints)" "$f"; then
            echo "AB-005 must not introduce duplicate staging/checkpoint tables"
            exit 1
          fi
          echo "AB-005 static contract gate passed"
