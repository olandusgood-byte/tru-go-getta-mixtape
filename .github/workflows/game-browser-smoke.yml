name: Game Browser Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, game/v218-canonical-promotion]
    paths:
      - 'game/**'
      - 'tgg-core/public/live-viewer/**'
      - '.github/workflows/game-browser-smoke.yml'
  pull_request:
    paths:
      - 'game/**'
      - 'tgg-core/public/live-viewer/**'
      - '.github/workflows/game-browser-smoke.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: game-browser-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_TeV8b8Rv4jnchCzdYOOIehl2
      VERCEL_PROJECT_ID: prj_U2qDy9qZ5EZAKuHTEaA03BMmmplX
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install unified certification runtime
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Static Gate in unified chain
        run: node game/ci-static-gate.mjs

      - name: Run Mega Regression in unified chain
        env:
          TGG_3D_V218_MEGA_ONLY: '1'
          TGG_3D_V218_ROOT: 'game'
        run: node tgg-browser-worker/3d-smoke-once.mjs
      - name: Start local game server
        run: |
          python3 -m http.server 8765 --directory game > /tmp/tgg-game-server.log 2>&1 &
          echo $! > /tmp/tgg-game-server.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tgg-game-server.log
          exit 1
      - name: Start TGG LiveViewer server
        run: |
          python3 -m http.server 8766 --directory tgg-core/public > /tmp/tgg-live-viewer.log 2>&1 &
          echo $! > /tmp/tgg-live-viewer.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8766/live-viewer/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/tgg-live-viewer.log
          exit 1
      - name: Run browser smoke
        run: node game/browser-smoke.mjs
      - name: Run TGG LiveViewer smoke
        run: node game/live-viewer-smoke.mjs

      - name: Verify production credential
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN missing"; exit 1; }

      - name: Install pinned Vercel CLI
        if: github.ref == 'refs/heads/main'
        run: npm install --global vercel@59.23.1

      - name: Link production project
        if: github.ref == 'refs/heads/main'
        working-directory: game
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy exact certified SHA to production
        if: github.ref == 'refs/heads/main'
        id: prod
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>/tmp/vercel-deploy.log | tail -n 1)"
          cat /tmp/vercel-deploy.log
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"

      - name: Verify production runtime on same SHA
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.prod.outputs.url }}"
          expected="$(node -e "const r=require('./game/runtime-version.json');process.stdout.write(String(r.canonical_runtime||''))")"
          for attempt in 1 2 3 4 5; do
            body="$(vercel curl "$url" 2>/tmp/vercel-curl.log || true)"
            cat /tmp/vercel-curl.log || true
            if grep -Fq "$expected" <<<"$body" && grep -q 'city3d' <<<"$body"; then
              echo "UNIFIED TGG CERTIFICATION + LIVEVIEWER + PRODUCTION VERIFIED: $url · $expected · ${{ github.sha }}"
              exit 0
            fi
            sleep 5
          done
          echo "Production verification failed for exact SHA ${{ github.sha }}" >&2
          exit 1
      - name: Stop TGG LiveViewer server
        if: always()
        run: |
          if [ -f /tmp/tgg-live-viewer.pid ]; then kill $(cat /tmp/tgg-live-viewer.pid) || true; fi
      - name: Stop local game server
        if: always()
        run: |
          if [ -f /tmp/tgg-game-server.pid ]; then kill $(cat /tmp/tgg-game-server.pid) || true; fi
