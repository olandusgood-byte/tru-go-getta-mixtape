name: Game Static Gate

on:
  push:
    branches: [main, game/v1-foundation, game/v1-2-build]
    paths:
      - 'game/**'
      - '.github/workflows/game-static-gate.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-static-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game static gate
        run: node game/ci-static-gate.mjs
