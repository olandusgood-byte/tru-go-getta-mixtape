name: Game Static Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tgg-browser-worker/**'
      - 'tgg-core/**'
      - 'worker.mjs'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'game/**'
      - 'tgg-browser-worker/**'
      - 'tgg-core/**'
      - 'worker.mjs'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: game-static-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game static gate
        run: node game/ci-static-gate.mjs
