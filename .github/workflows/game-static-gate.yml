name: Game Static Gate
# V1.33 Street Reputation verification

on:
  push:
    branches: [feat/game-v1-33-street-reputation-20260918]
    paths:
      - 'game/**'
      - '.github/workflows/game-static-gate.yml'
      - '.github/workflows/game-v1-33-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -e
          for f in game/*.js; do node --check "$f"; done

      - name: Validate JSON manifests
        run: |
          set -e
          for f in game/*.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f"
          done

      - name: Run V1.33 static contract
        run: node game/static-contract.test.mjs

      - name: Validate local script references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('game/index.html').read_text()
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html):
              if src.startswith(('http://','https://')): continue
              p=Path('game')/src
              assert p.is_file(), f'missing script: {src}'
          print('V1.33 local script references verified.')
          PY
