name: Game Static Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run game static gate
        run: node game/ci-static-gate.mjs
