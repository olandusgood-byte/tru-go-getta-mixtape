name: Game Static Gate

on:
  push:
    branches: [game/v1-foundation, game/v1-2-build]
    paths: ['game/**']
  pull_request:
    paths: ['game/**']

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          for f in game/*.js; do
            node --check "$f"
          done
      - name: Validate JSON manifests
        run: |
          set -e
          for f in game/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
      - name: Validate script references
        run: |
          set -e
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('game/index.html').read_text()
          for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)[\"\']', html):
              p=Path('game')/src
              assert p.is_file(), f'missing script: {src}'
          print('All game script references exist.')
          PY
      - name: Validate required release controls
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('game/index.html').read_text()
          ids=re.findall(r'id=[\"\']([^\"\']+)[\"\']', html)
          required={'menu','creator','game','career','contentBoard','expansionBoard','progressionBoard','inventoryBoard','bridge','pause','hud','newGame','continueGame','startGame','missionBtn','careerBtn','contentBtn','advanceContentBtn','expansionBtn','progressionBtn','inventoryBtn','bridgeBtn','chainBtn','saveBtn','pauseBtn','resumeBtn','menuBtn'}
          missing=sorted(required-set(ids))
          assert not missing, 'missing required IDs: '+', '.join(missing)
          assert len(ids)==len(set(ids)), 'duplicate DOM ids detected'
          print('Required controls and unique IDs verified.')
          PY
      - name: Browser smoke gate
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8765 --directory game >/tmp/tgg-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          cat > game/browser-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'networkidle'});
          const result=await page.evaluate(()=>{
            const q=window.TGGQA?.run?.();
            const r=window.TGGReleaseQA?.run?.();
            const i=window.TGGV12Integrity?.run?.();
            return {q,r,i,apis:!!window.TGGGame&&!!window.TGGCareer&&!!window.TGGContent&&!!window.TGGExpansion&&!!window.TGGProgression&&!!window.TGGChains&&!!window.TGGDistricts&&!!window.TGGSave&&!!window.TGGInventory};
          });
          if(!result.apis||!result.q?.passed||!result.r?.passed||!result.i?.passed)throw new Error('QA gate failed: '+JSON.stringify(result));
          await page.click('#newGame');
          await page.fill('#stageName','Smoke Test');
          await page.click('#startGame');
          await page.click('#inventoryBtn');
          const inventory=await page.evaluate(()=>({api:!!window.TGGInventory,items:{...window.TGGInventory.state.items},screen:document.getElementById('inventoryBoard')?.classList.contains('active')}));
          if(!inventory.api||!inventory.screen||inventory.items.mic!==1||inventory.items['beat-pack']!==1)throw new Error('inventory starter pack failed: '+JSON.stringify(inventory));
          await page.click('[data-inventory-add="promo-flyers"]');
          const inventorySaved=await page.evaluate(()=>JSON.parse(localStorage.getItem('tgg-inventory-v1')));
          if(inventorySaved.items['promo-flyers']!==2)throw new Error('inventory persistence failed: '+JSON.stringify(inventorySaved));
          await page.click('#contentBtn');
          await page.click('#chainBtn');
          const chain=await page.evaluate(()=>window.TGGChains?.state?.active);
          if(chain!=='first-move')throw new Error('mission chain did not start');
          await page.click('[data-mission="flyer-run"]');
          await page.click('#advanceContentBtn');
          const saved=await page.evaluate(()=>localStorage.getItem('tgg-content-v1'));
          if(!saved)throw new Error('content state was not saved');
          await page.evaluate(()=>{
            const s=window.TGGGame.getState();
            s.level=3;
            s.xp=0;
            window.TGGGame.refresh();
            window.TGGDistricts.sync();
          });
          const districts=await page.evaluate(()=>window.TGGDistricts.state.unlocked.slice().sort());
          if(JSON.stringify(districts)!==JSON.stringify(['downtown','mixtape-ave','studio-row']))throw new Error('district unlock progression failed: '+JSON.stringify(districts));
          await page.evaluate(()=>{
            localStorage.setItem('tgg-game-v1',JSON.stringify({level:-4,cash:-99,xp:'bad',x:'bad',y:null}));
            window.TGGSave.repair();
          });
          const repaired=await page.evaluate(()=>JSON.parse(localStorage.getItem('tgg-game-v1')));
          if(!(repaired.level>=1&&repaired.cash>=0&&repaired.xp>=0&&Number.isFinite(repaired.x)&&Number.isFinite(repaired.y)))throw new Error('save repair failed: '+JSON.stringify(repaired));
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('V1.3 inventory + V1.2 browser smoke PASS');
          await browser.close();
          JS
          node game/browser-smoke.mjs
          rm -f game/browser-smoke.mjs
