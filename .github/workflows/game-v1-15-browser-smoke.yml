name: Game V1.15 Browser Smoke

on:
  push:
    branches:
      - feat/game-v1-15-city-depth-20260918
    paths:
      - 'game/**'
      - '.github/workflows/game-v1-15-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run V1.15 browser smoke
        run: python game/tests/browser_v115_smoke.py
