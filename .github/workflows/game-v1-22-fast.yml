name: Game V1.22 Fast Browser Gate

on:
  push:
    branches:
      - feat/game-v122-collision-camera-20260918
    paths:
      - 'game/**'
      - '.github/workflows/game-v1-22-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run focused V1.22 browser gate
        run: python game/tests/browser_v122_fast.py
