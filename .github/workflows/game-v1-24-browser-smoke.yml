name: Game V1.24 Unified 3D Smoke

on:
  push:
    branches:
      - feat/game-v1-24-unified-3d-slice-20260918
    paths:
      - 'game/**'
      - '.github/workflows/game-v1-24-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run V1.24 unified 3D browser smoke
        run: python game/tests/browser_v124_smoke.py
