name: Game V1.29 Bulk World Smoke

on:
  push:
    branches:
      - feat/game-v1-29-bulk-world-verified-20260918
    paths:
      - 'game/**'
      - '.github/workflows/game-v1-29-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run V1.29 browser smoke
        run: python game/tests/browser_v129_smoke.py
