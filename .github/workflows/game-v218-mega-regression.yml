name: Game V2.18 Mega Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v218-mega:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright runtime
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run exact V2.18 desktop + mobile regression
        env:
          TGG_3D_V218_MEGA_ONLY: '1'
          TGG_3D_V218_ROOT: 'game'
        run: node tgg-browser-worker/3d-smoke-once.mjs
