name: NOVA V1400 DSP QA
on:
  push:
    branches: [nova-v1400-dsp-qa]
    paths:
      - 'qa/**'
      - '.github/workflows/nova-v1400-dsp-qa.yml'
permissions:
  contents: read
jobs:
  dsp-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start local secure-context test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-http.log 2>&1 &
          echo $! > /tmp/nova-http.pid
          sleep 1
          curl --fail http://127.0.0.1:8765/qa/nova-v1400-dsp-qa.html >/dev/null
      - name: Start virtual audio sink
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pulseaudio >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y pulseaudio
          fi
          mkdir -p "${XDG_RUNTIME_DIR:-/tmp/runtime-$UID}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/tmp/runtime-$UID}"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 1
          pactl info
          pactl load-module module-null-sink sink_name=nova sink_properties=device.description=NOVA || true
          pactl set-default-sink nova || true
          echo "PULSE_SINK=nova" >> "$GITHUB_ENV"
      - name: Run real Chromium AudioWorklet + offline DSP QA
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium/Chrome binary found on runner" >&2
            exit 2
          fi
          echo "Using $CHROME"
          CHROME_BIN="$CHROME" node qa/run-dsp-qa.mjs
          cat nova-v1400-dsp-qa-result.txt
          grep -q '^QA_PASS::' nova-v1400-dsp-qa-result.txt
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-v1400-dsp-qa-evidence
          path: |
            nova-v1400-dsp-qa-result.txt
            /tmp/nova-http.log
          if-no-files-found: warn
