name: TGG Core Railway Deploy

on:
  push:
    branches:
      - main
    paths:
      - "tgg-core/**"
      - "tgg-browser-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tgg-core-railway-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgg-core-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TGG Core and Worker to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
      RAILWAY_PROJECT_ID: "49db9e70-3a4b-4737-ac74-716bebd5ad28"
      RAILWAY_ENVIRONMENT: "454e3152-df86-4af5-9f3b-0aae6cf1469e"
      RAILWAY_CORE_SERVICE: "cfa5c70c-9da2-49e6-bea4-21c4474ba8cb"
      RAILWAY_WORKER_SERVICE: "4508d8f5-c887-4b02-bd04-fc2650ef1f65"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        run: npm install -g @railway/cli

      - name: Validate Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN}" || {
            echo "Missing GitHub secret RAILWAY_API_KEY"
            exit 1
          }

      - name: Deploy TGG Core
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_CORE_SERVICE}" --json
          railway up --ci --service "${RAILWAY_CORE_SERVICE}" --verbose

      - name: Deploy TGG Job Worker
        shell: bash
        run: |
          set -euo pipefail
          railway link --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_WORKER_SERVICE}" --json
          railway up --ci --service "${RAILWAY_WORKER_SERVICE}" --verbose

      - name: Report deployed commit
        shell: bash
        run: |
          echo "TGG Core and Job Worker deploy requested for commit ${GITHUB_SHA}"
          echo "Core service: ${RAILWAY_CORE_SERVICE}"
          echo "Worker service: ${RAILWAY_WORKER_SERVICE}"
          echo "Railway environment: ${RAILWAY_ENVIRONMENT}"
