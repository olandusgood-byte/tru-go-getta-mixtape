name: TGG Core Railway Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgg-core-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TGG Core and Worker to Railway
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_KEY }}
      RAILWAY_PROJECT_ID: "521c80ba-7fc4-43eb-8f4c-116555193ead"
      RAILWAY_ENVIRONMENT: "587f22ff-60bf-4769-8003-39166db52ab0"
      RAILWAY_CORE_SERVICE: "62b107a7-0966-4a22-ba9a-112953b4fa4a"
      RAILWAY_WORKER_SERVICE: "3e279630-8309-45aa-9ecf-8ff6b99616be"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Install Railway CLI
        shell: bash
        run: npm install -g @railway/cli

      - name: Validate Railway credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN}" || {
            echo "Missing GitHub secret RAILWAY_API_KEY"
            exit 1
          }

      - name: Deploy TGG Core
        shell: bash
        run: |
          set -euo pipefail
          railway up --ci --verbose \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_CORE_SERVICE}"

      - name: Deploy TGG Job Worker
        shell: bash
        run: |
          set -euo pipefail
          railway up --ci --verbose \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_WORKER_SERVICE}"

      - name: Report deployed commit
        shell: bash
        run: |
          echo "TGG Core and Job Worker deploy requested for commit ${GITHUB_SHA}"
          echo "Core service: ${RAILWAY_CORE_SERVICE}"
          echo "Worker service: ${RAILWAY_WORKER_SERVICE}"
          echo "Railway environment: ${RAILWAY_ENVIRONMENT}"
          echo "Deployment source-of-truth: GitHub Actions checkout of ${GITHUB_SHA}"
