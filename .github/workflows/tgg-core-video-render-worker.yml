name: TGG Core Video Render Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/tgg-core-video-render-worker.mjs'
      - 'tgg-core/server.mjs'
      - 'tgg-core/schema.sql'
      - '.github/workflows/tgg-core-video-render-worker.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tgg-core-video-render-worker
  cancel-in-progress: false

jobs:
  render-one-master:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TGG_CORE_URL: https://tgg-core.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Verify worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tgg-core-video-render-worker.mjs
          grep -q "OIDC_AUDIENCE='tgg-core-video-render-worker'" scripts/tgg-core-video-render-worker.mjs
          grep -q "x-tgg-github-oidc" scripts/tgg-core-video-render-worker.mjs
          grep -q "x-tgg-render-lease" scripts/tgg-core-video-render-worker.mjs
          if grep -Eq 'SUPABASE_(SERVICE_ROLE|SECRET)_KEY|TGG_TOKEN_SECRET' scripts/tgg-core-video-render-worker.mjs; then
            echo "TGG Core render worker must remain secretless."
            exit 1
          fi

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Run one TGG Core render lease
        shell: bash
        run: node scripts/tgg-core-video-render-worker.mjs

      - name: Record workflow evidence
        if: always()
        shell: bash
        run: |
          echo "TGG Core video render worker run=$GITHUB_RUN_ID sha=$GITHUB_SHA event=$GITHUB_EVENT_NAME"
          echo "Boundary: GitHub OIDC -> TGG Core lease -> signed private source -> FFmpeg -> private output"
