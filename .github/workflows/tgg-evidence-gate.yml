name: TGG Production Evidence Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/tgg-evidence-gate.mjs'
      - 'scripts/tgg-evidence-gate.test.mjs'
      - 'evidence/**'
      - 'docs/EVIDENCE_EXECUTION_GATE.md'
      - '.github/workflows/tgg-evidence-gate.yml'

permissions:
  contents: read

jobs:
  evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test fail-closed evaluator
        run: node --test scripts/tgg-evidence-gate.test.mjs

      - name: Evaluate current live evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/tgg-evidence-gate.mjs \
            evidence/live-evidence-2026-09-12.json \
            evidence-decision.json
