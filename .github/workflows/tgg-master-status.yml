name: TGG Master Status

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evidence/**'
      - 'remediation/**'
      - 'integration/**'
      - 'status/**'
      - 'scripts/tgg-master-status.mjs'
      - 'scripts/tgg-master-status.test.mjs'
      - 'docs/MASTER_STATUS.md'
      - '.github/workflows/tgg-master-status.yml'

permissions:
  contents: read

jobs:
  master-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test status reconciliation
        run: node --test scripts/tgg-master-status.test.mjs
      - name: Confirm current checkpoint remains HOLD
        shell: bash
        run: |
          set +e
          node scripts/tgg-master-status.mjs generated-master-status.json
          code=$?
          set -e
          test "$code" -eq 2
          test "$(node -p "require('./generated-master-status.json').decision")" = "HOLD"
