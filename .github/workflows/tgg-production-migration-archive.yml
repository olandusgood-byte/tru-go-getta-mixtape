name: TGG Production Migration Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/tgg-production-migration-archive.mjs'
      - '.github/workflows/tgg-production-migration-archive.yml'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: tgg-production-migration-archive
  cancel-in-progress: false

jobs:
  export-production-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://xsofowzvwetamhyuvlpj.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secretless archive client
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/tgg-production-migration-archive.mjs
          grep -q "OIDC_AUDIENCE = 'tgg-migration-archive'" scripts/tgg-production-migration-archive.mjs
          if grep -Eq 'SUPABASE_(SERVICE_ROLE|SECRET)_KEY' scripts/tgg-production-migration-archive.mjs; then
            echo "Static Supabase server keys are forbidden in the migration archive client."
            exit 1
          fi

      - name: Export authoritative production migration history through OIDC
        shell: bash
        run: node scripts/tgg-production-migration-archive.mjs

      - name: Validate generated archive
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/production-history/manifest.json
          test -f supabase/production-history/README.md
          count="$(node -e "const m=require('./supabase/production-history/manifest.json'); process.stdout.write(String(m.migration_count))")"
          if [ "$count" -lt 1000 ]; then
            echo "Archive migration count unexpectedly small: $count"
            exit 1
          fi
          if grep -REn 'sk_live_[A-Za-z0-9]|whsec_[A-Za-z0-9]|sb_secret_[A-Za-z0-9]|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' supabase/production-history; then
            echo "High-risk secret literal detected in generated archive."
            exit 1
          fi

      - name: Open archive update pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/production-migration-archive-${GITHUB_RUN_ID}"
          git config user.name "tgg-production-bot"
          git config user.email "tgg-production-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add supabase/production-history
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
            exit 0
          fi
          git commit -m "Archive authoritative production migration history"
          git push origin "HEAD:$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Archive authoritative production migration history" \
            --body "Generated automatically from the production Supabase migration ledger through GitHub OIDC. Includes grouped historical SQL, manifest hashes, and secret-scan gates. Historical evidence only; direct production replay is prohibited."
