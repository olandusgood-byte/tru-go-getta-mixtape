name: TGG Unified Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'evidence/**'
      - 'remediation/**'
      - 'integration/**'
      - 'status/**'
      - 'package/**'
      - 'scripts/tgg-*.mjs'
      - 'docs/V5730_UNIFIED_READINESS_RUNNER.md'
      - '.github/workflows/tgg-unified-readiness.yml'

permissions:
  contents: read

jobs:
  unified-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test unified readiness decisions
        run: node --test scripts/tgg-readiness-runner.test.mjs
      - name: Confirm the current unified decision remains HOLD
        shell: bash
        run: |
          set +e
          node scripts/tgg-readiness-runner.mjs > unified-readiness.json
          code=$?
          set -e
          test "$code" -eq 2
          test "$(node -p "require('./unified-readiness.json').decision")" = "HOLD"
