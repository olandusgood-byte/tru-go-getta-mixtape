name: TGG Video Render Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/tgg-video-render-worker.mjs'
      - '.github/workflows/tgg-video-render-worker.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: tgg-video-render-worker
  cancel-in-progress: false

jobs:
  render-one-master:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: https://xsofowzvwetamhyuvlpj.supabase.co
    steps:
      - uses: actions/checkout@v4

      - name: Verify worker source
        shell: bash
        run: node --check scripts/tgg-video-render-worker.mjs

      - name: Ensure FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install pinned TUS client
        shell: bash
        run: npm install --no-save --package-lock=false --ignore-scripts tus-js-client@4.3.1

      - name: Process one queued master transcode
        shell: bash
        run: node scripts/tgg-video-render-worker.mjs
