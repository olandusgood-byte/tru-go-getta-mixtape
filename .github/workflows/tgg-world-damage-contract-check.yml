name: TGG World Damage Contract Check

on:
  push:
    branches:
      - tgg-world-damage-system
    paths:
      - 'game/unreal-fastlane/overlays/damage-v1/**'
      - '.github/workflows/tgg-world-damage-contract-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-damage-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile DAMAGE math tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGDamageMathTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamageMath.cpp" -I"$ROOT/Source/TGGWorld/Public" -o damage-tests
      - name: Run DAMAGE math tests
        shell: bash
        run: ./damage-tests
      - name: Compile hit-zone mapping tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGHitZoneMapTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGHitZoneMap.cpp" -I"$ROOT/Source/TGGWorld/Public" -o hit-zone-tests
      - name: Run hit-zone mapping tests
        shell: bash
        run: ./hit-zone-tests
      - name: Compile request-factory tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGDamageRequestFactoryTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamageRequestFactory.cpp" -I"$ROOT/Source/TGGWorld/Public" -o request-factory-tests
      - name: Run request-factory tests
        shell: bash
        run: ./request-factory-tests
      - name: Compile severity adapter tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGDamageSeverityTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamageSeverity.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamageRequestFactory.cpp" -I"$ROOT/Source/TGGWorld/Public" -o severity-tests
      - name: Run severity adapter tests
        shell: bash
        run: ./severity-tests
      - name: Compile presentation tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGDamagePresentationTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamagePresentation.cpp" -I"$ROOT/Source/TGGWorld/Public" -o presentation-tests
      - name: Run presentation tests
        shell: bash
        run: ./presentation-tests
      - name: Compile sanitized telemetry tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          g++ -std=c++17 -Wall -Wextra -Werror "$ROOT/Tests/TGGDamageTelemetryTests.cpp" "$ROOT/Source/TGGWorld/Private/Combat/TGGDamageTelemetry.cpp" -I"$ROOT/Source/TGGWorld/Public" -o telemetry-tests
      - name: Run sanitized telemetry tests
        shell: bash
        run: ./telemetry-tests
      - name: Check character component authority contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/TGGDamageComponentContract.py
      - name: Check character HUD contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/TGGDamageHudContract.py
      - name: Syntax-check character component against portable UE stubs
        shell: bash
        run: bash game/unreal-fastlane/overlays/damage-v1/Tests/TGGDamageComponentSyntaxCheck.sh
      - name: Run character and vehicle component behavior harness
        shell: bash
        run: bash game/unreal-fastlane/overlays/damage-v1/Tests/TGGDamageComponentBehaviorCheck.sh
      - name: Check vehicle component contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/TGGVehicleDamageComponentContract.py
      - name: Syntax-check vehicle component against portable UE stubs
        shell: bash
        run: bash game/unreal-fastlane/overlays/damage-v1/Tests/TGGVehicleDamageComponentSyntaxCheck.sh
      - name: Check overlay safety contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/ApplyTGGDamageOverlayContract.py
      - name: Check candidate QA launcher contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/TGGDamageCandidateQAContract.py
      - name: Check one-command R3 runtime handoff contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/StartTGGDamageR3RuntimeContract.py
      - name: Check R4 machine-ready runtime handoff contract
        shell: bash
        run: python game/unreal-fastlane/overlays/damage-v1/Tests/StartTGGDamageR4RuntimeContract.py
      - name: Scan DAMAGE source for embedded private credentials
        shell: bash
        run: |
          set -euo pipefail
          ROOT=game/unreal-fastlane/overlays/damage-v1
          if grep -R -nE 'TGG_(EOS_CLIENT_SECRET|SUPABASE_TEST_ACCESS_TOKEN|SENTRY_UNREAL_ENDPOINT)\s*=\s*["'"'"']' "$ROOT/Source" "$ROOT/scripts"; then
            echo 'TGG_DAMAGE_SECRET_SCAN: FAIL'
            exit 1
          fi
          echo 'TGG_DAMAGE_SECRET_SCAN: PASS'
