name: TGG World Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tgg-world-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_TeV8b8Rv4jnchCzdYOOIehl2
      VERCEL_PROJECT_ID: prj_U2qDy9qZ5EZAKuHTEaA03BMmmplX
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Resolve verified source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Verify exact-SHA certification suite
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('child_process');
          const sha=process.env.SOURCE_SHA;
          const repo=process.env.SOURCE_REPO;
          const token=process.env.GH_TOKEN;
          const required=['Game Static Gate','Game Browser Smoke','Game V2.18 Mega Regression'];
          const terminalFailure=new Set(['failure','cancelled','timed_out','action_required','stale','startup_failure']);
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          function fetchRuns(){
            const raw=execFileSync('curl',[
              '-fsSL',
              '-H',`Authorization: Bearer ${token}`,
              '-H','Accept: application/vnd.github+json',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              `https://api.github.com/repos/${repo}/actions/runs?head_sha=${sha}&per_page=100`
            ],{encoding:'utf8'});
            return JSON.parse(raw).workflow_runs||[];
          }
          (async()=>{
            for(let attempt=1;attempt<=60;attempt++){
              const mainRuns=fetchRuns().filter(r=>r.head_sha===sha&&r.head_branch==='main');
              const summary={};
              let waiting=false;
              for(const name of required){
                const latest=mainRuns.filter(r=>r.name===name).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0]||null;
                summary[name]=latest?{id:latest.id,status:latest.status,conclusion:latest.conclusion,updated_at:latest.updated_at}:null;
                if(!latest||latest.status!=='completed'){waiting=true;continue;}
                if(terminalFailure.has(latest.conclusion)){
                  console.error('Certification terminal failure for exact SHA',sha,JSON.stringify(summary,null,2));
                  process.exit(1);
                }
                if(latest.conclusion!=='success'){
                  console.error('Certification blocked for exact SHA',sha,JSON.stringify(summary,null,2));
                  process.exit(1);
                }
              }
              if(!waiting){
                console.log('Exact-SHA certification GREEN',sha,JSON.stringify(summary));
                return;
              }
              console.log(`Waiting for exact-SHA certification attempt ${attempt}/60`,sha,JSON.stringify(summary));
              await sleep(10000);
            }
            console.error('Timed out waiting for exact-SHA certification',sha);
            process.exit(1);
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Verify canonical regression contract
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "TGG_3D_V218_ROOT: 'game'" .github/workflows/game-v218-mega-regression.yml
          node <<'NODE'
          const fs=require('fs');
          const runtime=JSON.parse(fs.readFileSync('game/runtime-version.json','utf8'));
          const html=fs.readFileSync('game/index.html','utf8');
          const mega=fs.readFileSync('game/mega-qa.js','utf8');
          const canonical=String(runtime.canonical_runtime||'').trim();
          const base=String(runtime.base_runtime||'').trim();
          if(!/^V\d+\.\d+\s+/.test(canonical)) throw new Error('Invalid canonical_runtime: '+canonical);
          if(!base) throw new Error('Missing base_runtime');
          if(!html.includes(canonical)) throw new Error('index.html does not expose canonical runtime: '+canonical);
          if(!html.includes('city3d')) throw new Error('index.html missing city3d contract');
          if(!mega.includes('window.TGGMegaQA')) throw new Error('mega QA contract missing');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'canonical_runtime='+canonical+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'base_runtime='+base+'\n');
          console.log('Canonical runtime verified:',canonical,'base:',base);
          NODE
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Check Vercel deploy credential
        id: auth
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::VERCEL_TOKEN is not configured; production deployment is blocked."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Vercel CLI
        if: steps.auth.outputs.ready == 'true'
        run: npm install --global vercel@59.23.1

      - name: Link production project
        if: steps.auth.outputs.ready == 'true'
        working-directory: game
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy canonical game to production
        if: steps.auth.outputs.ready == 'true'
        id: deploy
        working-directory: game
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>/tmp/vercel-deploy.log | tail -n 1)"
          cat /tmp/vercel-deploy.log
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production URL: $url"

      - name: Verify deployed page
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          expected="${{ steps.gate.outputs.canonical_runtime }}"
          for attempt in 1 2 3 4 5; do
            body="$(vercel curl "$url" 2>/tmp/vercel-curl.log || true)"
            cat /tmp/vercel-curl.log || true
            if grep -Fq "$expected" <<<"$body" && grep -q 'city3d' <<<"$body"; then
              echo "TGG World production deployment verified: $url · $expected"
              exit 0
            fi
            sleep 5
          done
          echo "Production deployment did not expose expected runtime: $expected" >&2
          exit 1

      - name: Credential status
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "Deployment blocked fail-closed: VERCEL_TOKEN is not configured." >&2
          exit 1
