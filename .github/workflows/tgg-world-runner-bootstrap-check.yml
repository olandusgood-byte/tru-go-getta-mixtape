name: TGG World Runner Bootstrap Check

on:
  push:
    branches:
      - tgg-world-unreal-fastlane
    paths:
      - 'scripts/windows/Install-TGGWorldRunner.ps1'
      - 'scripts/windows/Install-TGGWorldRunner.Tests.ps1'
      - 'scripts/windows/Start-TGGWorldRuntime.ps1'
      - 'scripts/windows/Start-TGGWorldRuntime.Tests.ps1'
      - 'scripts/windows/Bootstrap-TGGWorldMachine.ps1'
      - 'scripts/windows/Bootstrap-TGGWorldMachine.Tests.ps1'
      - '.github/workflows/tgg-world-unreal-runtime.yml'
      - '.github/workflows/tgg-world-runner-bootstrap-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate runner bootstrap contract
        shell: pwsh
        run: .\scripts\windows\Install-TGGWorldRunner.Tests.ps1
      - name: Validate one-command runtime launcher contract
        shell: pwsh
        run: .\scripts\windows\Start-TGGWorldRuntime.Tests.ps1
      - name: Validate fresh-machine bootstrap contract
        shell: pwsh
        run: .\scripts\windows\Bootstrap-TGGWorldMachine.Tests.ps1
