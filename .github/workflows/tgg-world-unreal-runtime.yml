name: TGG World Unreal Runtime Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - tgg-world-unreal-fastlane
    paths:
      - 'game/unreal-fastlane/checkpoints/e628173/**'
      - 'game/unreal-fastlane/RELEASE-READINESS-e628173.md'
      - 'game/unreal-fastlane/WINDOWS-RUNTIME-RUNBOOK-e628173.md'
      - 'game/unreal-fastlane/README.md'
      - '.github/workflows/tgg-world-unreal-runtime.yml'

permissions:
  contents: read

concurrency:
  group: tgg-world-unreal-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  # These are client/public runtime values, not privileged credentials.
  TGG_SUPABASE_URL: https://xsofowzvwetamhyuvlpj.supabase.co
  TGG_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mJQg4LjW-9KsW5B1zzJH8Q_e-kA-bbv
  TGG_POSTHOG_PROJECT_TOKEN: phc_t2i5sAzpSE5WL2CRzA3DyLggpeHLpHWkB6bwyJ6K79s6

jobs:
  hosted-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      backend_ready: ${{ steps.capabilities.outputs.backend_ready }}
      multiplayer_ready: ${{ steps.capabilities.outputs.multiplayer_ready }}
      observability_ready: ${{ steps.capabilities.outputs.observability_ready }}
    env:
      TGG_EOS_ARTIFACT_NAME: ${{ secrets.TGG_EOS_ARTIFACT_NAME }}
      TGG_EOS_PRODUCT_ID: ${{ secrets.TGG_EOS_PRODUCT_ID }}
      TGG_EOS_SANDBOX_ID: ${{ secrets.TGG_EOS_SANDBOX_ID }}
      TGG_EOS_DEPLOYMENT_ID: ${{ secrets.TGG_EOS_DEPLOYMENT_ID }}
      TGG_EOS_CLIENT_ID: ${{ secrets.TGG_EOS_CLIENT_ID }}
      TGG_EOS_CLIENT_SECRET: ${{ secrets.TGG_EOS_CLIENT_SECRET }}
      TGG_EOS_CLIENT_ENCRYPTION_KEY: ${{ secrets.TGG_EOS_CLIENT_ENCRYPTION_KEY }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN_A: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN_A }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN_B: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN_B }}
      TGG_EOS_AUTH_TYPE_A: ${{ secrets.TGG_EOS_AUTH_TYPE_A }}
      TGG_EOS_AUTH_LOGIN_A: ${{ secrets.TGG_EOS_AUTH_LOGIN_A }}
      TGG_EOS_AUTH_PASSWORD_A: ${{ secrets.TGG_EOS_AUTH_PASSWORD_A }}
      TGG_EOS_AUTH_TYPE_B: ${{ secrets.TGG_EOS_AUTH_TYPE_B }}
      TGG_EOS_AUTH_LOGIN_B: ${{ secrets.TGG_EOS_AUTH_LOGIN_B }}
      TGG_EOS_AUTH_PASSWORD_B: ${{ secrets.TGG_EOS_AUTH_PASSWORD_B }}
      TGG_SENTRY_UNREAL_ENDPOINT: ${{ secrets.TGG_SENTRY_UNREAL_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify e628173 checkpoint transport
        shell: pwsh
        run: |
          $chunkDir = 'game/unreal-fastlane/checkpoints/e628173'
          $parts = @(Get-ChildItem $chunkDir -Filter 'TGG_WORLD_UNREAL_FASTLANE_e628173.tar.gz.b64.chunk*' | Sort-Object Name)
          if ($parts.Count -ne 19) {
            throw "Expected exactly 19 e628173 checkpoint chunks, found $($parts.Count)."
          }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $bytes = [Convert]::FromBase64String($encoded)
          $rebuilt = Join-Path $env:RUNNER_TEMP 'TGG_WORLD_UNREAL_FASTLANE_e628173.tar.gz'
          [IO.File]::WriteAllBytes($rebuilt, $bytes)
          $expectedSha = 'd9873c842d66b0508d0b8e447de8e2cdb95362c5d15e4486e50cbb5e3f51bd58'
          $actualSha = (Get-FileHash $rebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "Checkpoint SHA-256 mismatch. expected=$expectedSha actual=$actualSha"
          }
          Write-Host "TGG_CHECKPOINT_TRANSPORT: PASS sha256=$actualSha"

      - name: Report optional runtime capability readiness
        id: capabilities
        shell: pwsh
        run: |
          function Has([string]$name) {
            -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))
          }

          $backendNames = @('TGG_SUPABASE_URL','TGG_SUPABASE_PUBLISHABLE_KEY','TGG_SUPABASE_TEST_ACCESS_TOKEN')
          $multiplayerNames = @(
            'TGG_SUPABASE_TEST_ACCESS_TOKEN_A','TGG_SUPABASE_TEST_ACCESS_TOKEN_B',
            'TGG_EOS_ARTIFACT_NAME','TGG_EOS_PRODUCT_ID','TGG_EOS_SANDBOX_ID','TGG_EOS_DEPLOYMENT_ID',
            'TGG_EOS_CLIENT_ID','TGG_EOS_CLIENT_SECRET','TGG_EOS_CLIENT_ENCRYPTION_KEY',
            'TGG_EOS_AUTH_TYPE_A','TGG_EOS_AUTH_LOGIN_A','TGG_EOS_AUTH_PASSWORD_A',
            'TGG_EOS_AUTH_TYPE_B','TGG_EOS_AUTH_LOGIN_B','TGG_EOS_AUTH_PASSWORD_B'
          )
          $observabilityNames = @('TGG_POSTHOG_PROJECT_TOKEN','TGG_SENTRY_UNREAL_ENDPOINT')

          function Ready($names) {
            foreach ($name in $names) { if (-not (Has $name)) { return $false } }
            return $true
          }

          $backendReady = Ready $backendNames
          $multiplayerReady = Ready $multiplayerNames
          $observabilityReady = Ready $observabilityNames

          "backend_ready=$($backendReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "multiplayer_ready=$($multiplayerReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "observability_ready=$($observabilityReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          Write-Host "TGG_BACKEND_CAPABILITY_READY: $backendReady"
          Write-Host "TGG_MULTIPLAYER_CAPABILITY_READY: $multiplayerReady"
          Write-Host "TGG_OBSERVABILITY_CAPABILITY_READY: $observabilityReady"

          $optional = ($backendNames + $multiplayerNames + $observabilityNames | Sort-Object -Unique)
          foreach ($name in $optional) {
            if (-not (Has $name)) { Write-Host "OPTIONAL_INPUT_MISSING: $name" }
          }

          Write-Host 'TGG_HOSTED_PREFLIGHT: PASS — missing optional credentials do not block core UE runtime evidence.'

  ue58-runtime-evidence:
    needs: hosted-preflight
    runs-on: [self-hosted, Windows, X64, tgg-ue58]
    timeout-minutes: 180
    env:
      TGG_EOS_ARTIFACT_NAME: ${{ secrets.TGG_EOS_ARTIFACT_NAME }}
      TGG_EOS_PRODUCT_ID: ${{ secrets.TGG_EOS_PRODUCT_ID }}
      TGG_EOS_SANDBOX_ID: ${{ secrets.TGG_EOS_SANDBOX_ID }}
      TGG_EOS_DEPLOYMENT_ID: ${{ secrets.TGG_EOS_DEPLOYMENT_ID }}
      TGG_EOS_CLIENT_ID: ${{ secrets.TGG_EOS_CLIENT_ID }}
      TGG_EOS_CLIENT_SECRET: ${{ secrets.TGG_EOS_CLIENT_SECRET }}
      TGG_EOS_CLIENT_ENCRYPTION_KEY: ${{ secrets.TGG_EOS_CLIENT_ENCRYPTION_KEY }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN_A: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN_A }}
      TGG_SUPABASE_TEST_ACCESS_TOKEN_B: ${{ secrets.TGG_SUPABASE_TEST_ACCESS_TOKEN_B }}
      TGG_EOS_AUTH_TYPE_A: ${{ secrets.TGG_EOS_AUTH_TYPE_A }}
      TGG_EOS_AUTH_LOGIN_A: ${{ secrets.TGG_EOS_AUTH_LOGIN_A }}
      TGG_EOS_AUTH_PASSWORD_A: ${{ secrets.TGG_EOS_AUTH_PASSWORD_A }}
      TGG_EOS_AUTH_TYPE_B: ${{ secrets.TGG_EOS_AUTH_TYPE_B }}
      TGG_EOS_AUTH_LOGIN_B: ${{ secrets.TGG_EOS_AUTH_LOGIN_B }}
      TGG_EOS_AUTH_PASSWORD_B: ${{ secrets.TGG_EOS_AUTH_PASSWORD_B }}
      TGG_SENTRY_UNREAL_ENDPOINT: ${{ secrets.TGG_SENTRY_UNREAL_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify checkpoint archive
        id: checkpoint
        shell: pwsh
        run: |
          $chunkDir = 'game/unreal-fastlane/checkpoints/e628173'
          $parts = @(Get-ChildItem $chunkDir -Filter 'TGG_WORLD_UNREAL_FASTLANE_e628173.tar.gz.b64.chunk*' | Sort-Object Name)
          if ($parts.Count -ne 19) {
            throw "Expected exactly 19 e628173 checkpoint chunks, found $($parts.Count)."
          }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          try { $bytes = [Convert]::FromBase64String($encoded) }
          catch { throw "Checkpoint base64 decode failed: $($_.Exception.Message)" }
          $rebuilt = Join-Path $env:RUNNER_TEMP 'TGG_WORLD_UNREAL_FASTLANE_e628173.tar.gz'
          [IO.File]::WriteAllBytes($rebuilt, $bytes)
          $expectedSha = 'd9873c842d66b0508d0b8e447de8e2cdb95362c5d15e4486e50cbb5e3f51bd58'
          $actualSha = (Get-FileHash $rebuilt -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "Checkpoint SHA-256 mismatch. expected=$expectedSha actual=$actualSha"
          }
          "archive=$rebuilt" >> $env:GITHUB_OUTPUT
          "sha256=$actualSha" >> $env:GITHUB_OUTPUT
          Write-Host "Verified e628173 checkpoint sha256=$actualSha"

      - name: Extract checkpoint
        id: extract
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'tgg-world-unreal-runtime'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          tar -xzf '${{ steps.checkpoint.outputs.archive }}' -C $work
          $project = Get-ChildItem $work -Filter TGGWorld.uproject -Recurse | Select-Object -First 1
          if (-not $project) { throw 'TGGWorld.uproject not found after extraction.' }
          "root=$($project.Directory.FullName)" >> $env:GITHUB_OUTPUT

      - name: UE 5.8 fast-lane preflight
        shell: pwsh
        working-directory: ${{ steps.extract.outputs.root }}
        run: .\scripts\windows\TGG_FASTLANE_PREFLIGHT.ps1

      - name: Compile, package, and collect all available runtime evidence
        id: finalqa
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ steps.extract.outputs.root }}
        run: .\scripts\windows\TGG_FASTLANE_FINAL_QA.ps1

      - name: Classify credential-free core runtime gates
        if: always() && steps.extract.outputs.root != ''
        shell: pwsh
        working-directory: ${{ steps.extract.outputs.root }}
        run: |
          $smokeRoot = Join-Path (Get-Location) 'Builds\Win64-Development\_smoke'
          function HasMarker([string]$file, [string]$marker) {
            $path = Join-Path $smokeRoot $file
            if (-not (Test-Path -LiteralPath $path)) { return $false }
            return [bool](Select-String -LiteralPath $path -SimpleMatch $marker -Quiet)
          }

          $bootPass = HasMarker 'TGGFastlaneSmoke.log' 'TGG_FASTLANE_SMOKE: PASS'
          $gameplayPass = HasMarker 'TGGFastlaneFinalGameplayQA.log' 'TGG_FASTLANE_FINAL_GAMEPLAY_QA: PASS'
          $backendPass = HasMarker 'TGGFastlaneBackendSmoke.log' 'TGG_FASTLANE_BACKEND_SMOKE: PASS'
          $multiplayerPass = HasMarker 'TGGFastlaneMultiplayerProof.log' 'TGG_FASTLANE_MULTIPLAYER_PROOF: PASS'
          $posthogPass = HasMarker 'TGGFastlaneTelemetrySmoke.log' 'TGG_FASTLANE_TELEMETRY_SMOKE: PASS'
          $sentryPass = HasMarker 'TGGFastlaneSentryCrashProof.log' 'TGG_FASTLANE_SENTRY_CRASH_PROOF: PASS'

          Write-Host "TGG_PACKAGE_BOOT_GATE: $bootPass"
          Write-Host "TGG_GAMEPLAY_GATE: $gameplayPass"
          Write-Host "TGG_BACKEND_GATE: $backendPass"
          Write-Host "TGG_MULTIPLAYER_GATE: $multiplayerPass"
          Write-Host "TGG_POSTHOG_GATE: $posthogPass"
          Write-Host "TGG_SENTRY_GATE: $sentryPass"
          Write-Host "TGG_FINAL_QA_STEP_OUTCOME: ${{ steps.finalqa.outcome }}"

          if (-not $bootPass -or -not $gameplayPass) {
            throw 'Credential-free core runtime evidence is incomplete. Inspect the uploaded smoke artifact before changing readiness.'
          }
          Write-Host 'TGG_CORE_RUNTIME_EVIDENCE: PASS'

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgg-world-runtime-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ steps.extract.outputs.root }}/Builds/Win64-Development/_smoke/**
            ${{ steps.extract.outputs.root }}/TGG_FASTLANE_RUNTIME_EVIDENCE.json
            ${{ steps.extract.outputs.root }}/TGG_FASTLANE_FINAL_QA.md
