name: TGG World V4.40 Manual Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgg-world-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V4.40 payload
        run: |
          test -f game/v440-home-social.js
          test -f game/v440-home-social.css
          grep -q "V4.40 HOME SOCIAL LIFE MEGA" game/index.html
          grep -q "V4.40 HOME SOCIAL LIFE MEGA" game/runtime-version.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Bind production project
        working-directory: game
        run: |
          mkdir -p .vercel
          printf '{"orgId":"team_TeV8b8Rv4jnchCzdYOOIehl2","projectId":"prj_U2qDy9qZ5EZAKuHTEaA03BMmmplX"}' > .vercel/project.json

      - name: Deploy V4.40 to production
        working-directory: game
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
