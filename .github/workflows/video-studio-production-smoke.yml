name: Video Studio Production Render Smoke

on:
  push:
    branches: [main]
    paths:
      - 'tgg-core/**'
      - 'render.yaml'
      - '.github/workflows/video-studio-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-studio-production-smoke
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render auto-deploy
        shell: bash
        run: |
          set -euo pipefail
          health='https://tgg-core.onrender.com/health'
          studio='https://tgg-core.onrender.com/video-studio/'
          ok=0
          for attempt in $(seq 1 30); do
            echo "Production check attempt $attempt/30"
            health_body="$(curl -fsS --max-time 20 "$health" 2>/dev/null || true)"
            studio_body="$(curl -fsSL --max-time 30 "$studio" 2>/dev/null || true)"
            if [ -n "$health_body" ] \
              && echo "$studio_body" | grep -q 'TGG Video Studio' \
              && echo "$studio_body" | grep -q 'previewCanvas' \
              && echo "$studio_body" | grep -q 'timelineViewport' \
              && echo "$studio_body" | grep -q 'Server FFmpeg Render' \
              && echo "$studio_body" | grep -q 'PRO WORKSTATION · V2.5.0' \
              && echo "$studio_body" | grep -q 'pro-ai.js?v=2.5.0' \
              && echo "$studio_body" | grep -q 'gpu-fx.js?v=2.5.0'; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Render production did not expose the expected Video Studio contract."
            exit 1
          fi
          echo "Render production Video Studio contract verified."

      - name: Verify static assets
        shell: bash
        run: |
          set -euo pipefail
          app_body="$(curl -fsSL --max-time 30 'https://tgg-core.onrender.com/video-studio/app.js?v=2.5.0')"
          css_body="$(curl -fsSL --max-time 30 'https://tgg-core.onrender.com/video-studio/styles.css?v=2.4.1')"
          ai_body="$(curl -fsSL --max-time 30 'https://tgg-core.onrender.com/video-studio/pro-ai.js?v=2.5.0')"
          gpu_body="$(curl -fsSL --max-time 30 'https://tgg-core.onrender.com/video-studio/gpu-fx.js?v=2.5.0')"
          ai_css_body="$(curl -fsSL --max-time 30 'https://tgg-core.onrender.com/video-studio/pro-ai.css?v=2.5.0')"
          grep -q 'queueServerRender' <<<"$app_body"
          grep -q "version:'2.5.0'" <<<"$app_body"
          grep -q 'monitor-bezel' <<<"$css_body"
          grep -q 'function autoEdit' <<<"$ai_body"
          grep -q 'tgg-block-match-v1' <<<"$ai_body"
          grep -q 'VideoEncoder.isConfigSupported' <<<"$ai_body"
          grep -q 'TGGVideoGPU' <<<"$gpu_body"
          grep -q 'ai-director-view' <<<"$ai_css_body"
          echo "Video Studio V2.5 production assets verified."
