services:
  - type: web
    name: tgg-core
    runtime: node
    region: ohio
    plan: free
    branch: main
    autoDeploy: true
    rootDir: tgg-core
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tgg-core-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TGG_TOKEN_SECRET
        generateValue: true

  - type: web
    name: tgg-self-hosted-browser-worker
    runtime: node
    region: oregon
    plan: free
    branch: tgg-worker-stable
    autoDeploy: true
    rootDir: tgg-browser-worker
    buildCommand: npm install && npx playwright install chromium
    startCommand: node worker.mjs
    healthCheckPath: /health
    envVars:
      - key: TGG_CORE_URL
        value: https://tgg-core.onrender.com

databases:
  - name: tgg-core-db
    plan: free
    region: ohio
    postgresMajorVersion: 18
