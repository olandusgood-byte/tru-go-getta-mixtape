<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>TGG Live Viewer</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f4f4;background:#070707}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#241010,#070707 42%);min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:#c7ff00}.muted{color:#999;font-size:13px}button,input{background:#111;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}button{cursor:pointer}button:hover{border-color:#e50914}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px;margin-top:18px}.panel{background:#0d0d0d;border:1px solid #292929;border-radius:14px;overflow:hidden}.hd{padding:14px 16px;border-bottom:1px solid #292929;font-weight:800}.sessions{max-height:70vh;overflow:auto}.session{padding:14px 16px;border-bottom:1px solid #222;cursor:pointer}.session.active{border-left:3px solid #c7ff00;background:#141414}.pill{display:inline-block;padding:3px 7px;border-radius:20px;font-size:11px;margin-top:7px;background:#202020}.live{color:#c7ff00}.bad{color:#ff5c5c}.main{padding:18px}.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#111;border:1px solid #292929;border-radius:10px}.stat strong{display:block;font-size:22px;margin-top:5px}.stream{margin-top:14px;height:300px;background:#050505;border:1px solid #292929;border-radius:10px;padding:14px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}.event{padding:8px 0;border-bottom:1px solid #191919}.event b{color:#e50914}.bar{display:flex;gap:8px;margin:12px 0}.bar input{flex:1}.empty{padding:30px;text-align:center;color:#777}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">TGG <b>LIVE VIEWER</b></div><div class="muted">TGG-owned browser control room · real-time telemetry</div></div><div><button id="refresh">Refresh</button> <span id="conn" class="muted">Disconnected</span></div></div><div class="bar"><input id="token" type="password" placeholder="TGG session token (Bearer token)"><button id="connect">Connect</button></div><div id="certs" class="panel" style="margin-top:18px"><div class="hd">Certification Pipeline</div><div id="certList" style="padding:14px">—</div></div><div class="grid"><section class="panel"><div class="hd">Browser Sessions</div><div id="sessions" class="sessions"><div class="empty">Connect to load sessions.</div></div></section><section class="panel"><div class="main"><div class="hero"><div class="stat">Status<strong id="status">—</strong></div><div class="stat">Worker<strong id="worker">—</strong></div><div class="stat">Flow<strong id="flow">—</strong></div><div class="stat">Events<strong id="count">0</strong></div></div><div id="stream" class="stream"><div class="empty">Select a browser session.</div></div></div></section></div></div><script>
const API=location.origin;let token='',sid='',es=null,count=0;const $=id=>document.getElementById(id);
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function load(){if(!token)return;const r=await fetch(API+'/v1/live-viewer/overview',{headers:headers()});if(!r.ok){$('conn').textContent='Auth failed';return}const d=await r.json();const el=$('sessions');el.innerHTML='';(d.sessions||[]).forEach(s=>{const x=document.createElement('div');x.className='session'+(s.id===sid?' active':'');x.innerHTML='<b>'+s.id.slice(0,8)+'</b><div class="muted">'+new Date(s.updated_at).toLocaleString()+'</div><span class="pill '+(s.status==='active'?'live':'')+'">'+s.status+'</span>';x.onclick=()=>select(s.id);el.appendChild(x)});const cl=$('certList');cl.innerHTML=(d.certifications||[]).length?(d.certifications||[]).map(c=>'<div class="event"><b>'+c.status+'</b> · '+escapeHtml(c.certification_type||'certification')+' · '+String(c.id).slice(0,8)+'</div>').join(''):'<span class="muted">No certifications yet.</span>';if(!sid&&d.sessions?.[0])select(d.sessions[0].id)}
async function select(id){sid=id;count=0;$('count').textContent='0';document.querySelectorAll('.session').forEach(x=>x.classList.remove('active'));const r=await fetch(API+'/v1/browser/sessions/'+encodeURIComponent(id)+'/viewer/state',{headers:headers()});if(!r.ok)return;const d=await r.json();$('status').textContent=d.session.status||'—';$('worker').textContent=d.session.metadata?.worker_id||'—';$('flow').textContent=d.latest_event?.event_type||'idle';$('stream').innerHTML='';if(d.latest_event)addEvent(d.latest_event);if(es)es.abort?.();const ctl=new AbortController();es=ctl; (async()=>{try{const resp=await fetch(API+'/v1/browser/sessions/'+encodeURIComponent(id)+'/viewer/stream?after=0',{headers:{Authorization:'Bearer '+token},signal:ctl.signal});if(!resp.ok)throw new Error('stream '+resp.status);$('conn').textContent='LIVE';$('conn').className='live';const reader=resp.body.getReader(),dec=new TextDecoder();let buf='';for(;;){const q=await reader.read();if(q.done)break;buf+=dec.decode(q.value,{stream:true});const parts=buf.split('\\n\\n');buf=parts.pop();for(const block of parts){let typ='state',data='{}',created_at=new Date().toISOString();for(const line of block.split('\\n')){if(line.startsWith('event:'))typ=line.slice(6).trim();if(line.startsWith('data:'))data=line.slice(5).trim();}if(data&&data!=='{}')try{addEvent({event_type:typ,payload:JSON.parse(data),created_at})}catch{}}}}catch(e){if(e.name!=='AbortError'){$('conn').textContent='Reconnecting…';$('conn').className='muted';setTimeout(()=>select(id),1500)}}})()}
function addEvent(e){count++;$('count').textContent=count;$('flow').textContent=e.event_type||'—';const x=document.createElement('div');x.className='event';x.innerHTML='<b>'+String(e.event_type||'event')+'</b> <span class="muted">'+new Date(e.created_at||Date.now()).toLocaleTimeString()+'</span><div>'+escapeHtml(JSON.stringify(e.payload||{}))+'</div>';$('stream').prepend(x)}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('connect').onclick=()=>{token=$('token').value.trim();sid='';$('conn').textContent='Connecting…';load()};$('refresh').onclick=load;
</script></body></html>
